<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Faceless Studio{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}">
</head>
<body>
  {% if user %}
  <header class="topbar">
    <a class="brand" href="/">Faceless Studio <span class="version">v{{ version }}</span></a>
    <nav>
      <a href="/">Proyectos</a>
      <a href="/canales">Canales</a>
      <a href="/configuracion">Configuración</a>
    </nav>
    <form method="post" action="/salir" class="logout">
      <span class="muted">{{ user.username }}</span>
      <button class="btn-link">Salir</button>
    </form>
  </header>
  {% endif %}
  <main class="{% block main_class %}page{% endblock %}">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
