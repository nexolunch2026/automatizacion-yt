<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Faceless Studio{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', path='style.css') }}?v={{ version }}">
  <meta name="theme-color" content="#0b0d12">
</head>
<body>
  {% if user %}
  <header class="topbar">
    <a class="brand" href="/">Faceless Studio <span class="version">v{{ version }}</span></a>
    {% set path = request.url.path %}
    <nav>
      <a href="/" class="{{ 'active' if path == '/' or path.startswith('/proyectos') }}">🎬 Proyectos</a>
      <a href="/jarvis" class="nav-jarvis {{ 'active' if path.startswith('/jarvis') }}">🤖 JARVIS</a>
      <a href="/rendimiento" class="{{ 'active' if path.startswith('/rendimiento') }}">📈 Rendimiento</a>
      <a href="/aprender" class="{{ 'active' if path.startswith('/aprender') }}">🎓 Aprender</a>
      <a href="/canales" class="{{ 'active' if path.startswith('/canales') }}">🧭 Canales</a>
      <a href="/configuracion" class="{{ 'active' if path.startswith('/configuracion') or path.startswith('/bienvenida') }}">⚙️ Configuración</a>
    </nav>
    <form method="post" action="/salir" class="logout">
      <span class="muted">{{ user.username }}</span>
      <button class="btn-link">Salir</button>
    </form>
  </header>
  {% endif %}
  <main class="{% block main_class %}page{% endblock %}">
    {% block content %}{% endblock %}
  </main>
</body>
</html>
