# Entorno local completo: docker compose up --build
# Web: http://localhost:3000 · API: http://localhost:8000/docs
name: faceless-studio

x-api-env: &api-env
  APP_ENV: development
  SECRET_KEY: ${SECRET_KEY:-dev-secret-change-me}
  ENCRYPTION_KEY: ${ENCRYPTION_KEY:-}
  DATABASE_URL: postgresql+psycopg://faceless:faceless@postgres:5432/faceless
  REDIS_URL: redis://redis:6379/0
  S3_ENDPOINT: http://storage:8333
  S3_BUCKET: faceless
  S3_ACCESS_KEY: local
  S3_SECRET_KEY: local
  WEB_ORIGIN: http://localhost:3000

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: faceless
      POSTGRES_PASSWORD: faceless
      POSTGRES_DB: faceless
    volumes: [pgdata:/var/lib/postgresql/data]
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U faceless"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  # Almacenamiento compatible con S3 (vídeos, audio, imágenes).
  storage:
    image: chrislusf/seaweedfs:latest
    command: server -dir=/data -s3 -s3.port=8333
    volumes: [storage:/data]
    ports: ["8333:8333"]

  api:
    build: ./apps/api
    environment: *api-env
    env_file: [{ path: .env, required: false }]
    volumes: ["./apps/api:/app"]
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports: ["8000:8000"]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      storage: { condition: service_started }

  worker:
    build: ./apps/api
    environment: *api-env
    env_file: [{ path: .env, required: false }]
    volumes: ["./apps/api:/app"]
    command: celery -A app.workers.celery_app worker --loglevel=info --concurrency=2
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  web:
    build: { context: ./apps/web, target: dev }
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      WATCHPACK_POLLING: "true" # recarga en caliente fiable en Windows
      NEXT_TELEMETRY_DISABLED: "1"
    volumes:
      - ./apps/web:/app
      - /app/node_modules
      - /app/.next
    ports: ["3000:3000"]
    depends_on: [api]

volumes:
  pgdata:
  storage:
