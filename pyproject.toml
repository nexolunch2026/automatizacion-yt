[project]
name = "faceless-studio"
version = "0.55.0"
description = "Productora de vídeos faceless para YouTube"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "sqlalchemy>=2.0",
    "jinja2>=3.1",
    "python-multipart>=0.0.9",
    "itsdangerous>=2.2",
    "argon2-cffi>=23.1",
    "google-genai>=2.27.0",
    "cryptography>=50.0.2",
    "piper-tts>=1.8",
    "imageio-ffmpeg>=0.6.0",
    "pillow>=12.3.0",
    "psutil>=7.2.2",
    "edge-tts>=7.2.8",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6"]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".claude"]  # guías de ECC: sus ejemplos de código no son del programa

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
